name: Secret scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Scan Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched refs
        run: |
          image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker pull "$image"
          if docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo "$image" git --redact=100 --log-opts="--all --full-history" /repo > /tmp/onyx4j-secret-scan.log 2>&1; then
            echo "Git history scan passed."
          else
            echo "::error::Secret scan failed or found a potential leak. Reproduce locally with Gitleaks and redacted output. No findings are published."
            exit 1
          fi
