name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vX.Y.Z or vX.Y.Z-RCn)'
        required: true
        type: string
      publish_maven:
        description: 'Publish to Maven (only for new, unpublished versions)'
        required: true
        type: boolean
        default: false
      backfill_rc2:
        description: 'Create historical RC2 GitHub release only'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || (github.ref == 'refs/heads/master' && !inputs.backfill_rc2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}
      - name: Validate release tag
        id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-RC[1-9][0-9]*)?$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          version="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Scan fetched Git history
        run: |
          set -euo pipefail
          image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker pull "$image"
          if ! docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo "$image" git --redact=100 --log-opts="--all --full-history" /repo > /tmp/onyx4j-release-scan.log 2>&1; then
            echo "::error::Secret scan failed. Reproduce locally with redacted Gitleaks output."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build and test
        run: gradle --no-daemon clean build shadowJar generatePomFileForOnyx4jPublication
      - name: Verify artifacts and prepare release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import xml.etree.ElementTree as ET
          import zipfile
          version = os.environ["VERSION"]
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          pom = ET.parse("build/publications/onyx4j/pom-default.xml")
          assert pom.findtext("m:version", namespaces=ns) == version, "Tag does not match Gradle version"
          assert pom.findtext("m:licenses/m:license/m:name", namespaces=ns) == "The Apache License, Version 2.0"
          dist = pathlib.Path("release-dist")
          dist.mkdir()
          for suffix in ("", "-sources", "-javadoc", "-withDependencies"):
              jar = pathlib.Path(f"build/libs/onyx4j-{version}{suffix}.jar")
              with zipfile.ZipFile(jar) as archive:
                  assert "META-INF/LICENSE" in archive.namelist()
                  if suffix == "-withDependencies":
                      entries = set(archive.namelist())
                      assert "com/google/gson/Gson.class" in entries
                      assert "io/socket/client/IO.class" in entries
                      assert any(p.startswith("META-INF/third-party/") for p in entries)
              shutil.copy2(jar, dist)
          shutil.copy2("build/publications/onyx4j/pom-default.xml", dist / f"onyx4j-{version}.pom")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          import re
          match = re.search(r"(?m)^## \[?" + re.escape(version) + r"\]?[^\n]*\n([\s\S]*?)(?=^## |^\[|\Z)", changelog)
          if not match or not match.group(1).strip():
              raise SystemExit(f"Missing changelog section for {version}")
          pathlib.Path("release-notes.md").write_text(match.group(1).strip() + "\n")
          PY
          (cd release-dist && sha256sum *.jar *.pom > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            release-dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7
      - name: Publish new version to Maven
        if: github.event_name == 'push' || inputs.publish_maven
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REPOSILITE_USERNAME" && test -n "$REPOSILITE_PASSWORD"
          base="https://repo.onyx4j.de/releases/de/onyx4j/onyx4j/$VERSION/onyx4j-$VERSION"
          for suffix in .pom .jar -sources.jar -javadoc.jar .module; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$base$suffix")"
            if [[ "$status" != 404 ]]; then
              echo "::error::Maven artifact exists or repository unavailable (HTTP $status); refusing to overwrite."
              exit 1
            fi
          done
          gradle --no-daemon publishOnyx4jPublicationToReposiliteRepository

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-RC* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" release-dist/* --verify-tag --title "$TAG | Onyx4J" --notes-file release-notes.md --generate-notes "${flags[@]}"

  historical-rc2:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.backfill_rc2 && inputs.tag == 'v1.0.0-RC2' && !inputs.publish_maven
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create historical RC2 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target=008cb2267c553310a462ebc8c246e6c3f1125bcb
          git merge-base --is-ancestor "$target" HEAD
          if git show-ref --verify --quiet refs/tags/v1.0.0-RC2; then
            test "$(git rev-parse 'refs/tags/v1.0.0-RC2^{commit}')" = "$target"
          fi
          cat > /tmp/rc2-notes.md <<'EOF'
          ## Gateway & API Expansion

          Historical release candidate for Java 25.

          - Expanded REST, commands, interactions and event webhooks.
          - Presence, scheduled messages, panels and rich message layouts.
          - Voice state management and gateway reliability improvements.

          Existing Maven artifacts are unchanged. Download the library, sources and JavaDocs from the [Maven repository](https://repo.onyx4j.de/#/releases/de/onyx4j/onyx4j/1.0.0-RC2).

          The Git tag points to the historical RC2 source commit. Licensing and release automation were added to the repository afterwards. Full live integration validation remains pending.
          EOF
          gh release create v1.0.0-RC2 --target "$target" --title 'v1.0.0-RC2 | Gateway & API Expansion' --notes-file /tmp/rc2-notes.md --prerelease --latest=false
